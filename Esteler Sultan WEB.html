<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Esteler Sultan 98 – Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Archivo+Black&display=swap">
<style>
:root{--br:#453535;--g:#FFB800;--y:#FFDD12;--gr:#D9D9D9;--t:#111;--m:#777;--bg:#fff;--card:#fff;--ln:#e6e6e6;--err:#D93025;--ok:#2E7D32;--ac:#FFB800;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#fff}}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}*{box-sizing:border-box}
body{margin:0;font:400 17px/1.5 Inter,system-ui,sans-serif;color:var(--t);background:var(--bg)}
img{max-width:100%;display:block}button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;line-height:1.1}h1{font-size:clamp(34px,6vw,64px);font-weight:700}h2{font-size:clamp(26px,4vw,40px);font-weight:700;margin-bottom:24px}
.w{max-width:1312px;margin:0 auto;padding:0 20px}@media(min-width:900px){.w{padding:0 64px}}
nav{background:var(--br);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav .w{display:flex;align-items:center;justify-content:space-between;height:76px}
.logo{font-size:24px;cursor:pointer;background:none;border:0;color:#fff;padding:8px 0}
.lk{display:flex;gap:28px;align-items:center}.lk button{background:none;border:0;color:#fff;padding:10px 4px;font-size:17px}
.lk button:hover,.lk .on{color:var(--y)}.cb{background:var(--g)!important;color:#000!important;border-radius:20px;padding:8px 14px!important;font-weight:700}
.hb{display:none;background:none;border:1px solid #fff6;color:#fff;border-radius:10px;width:48px;height:48px;font-size:22px}
@media(max-width:760px){.hb{display:block}.lk{display:none;position:absolute;left:0;right:0;top:76px;background:var(--br);flex-direction:column;align-items:stretch;padding:8px 20px 16px;gap:0}.lk.open{display:flex}.lk button{text-align:left;min-height:48px;border-top:1px solid #fff2}}
.btn{background:#000;color:#fff;border:0;border-radius:12px;padding:14px 28px;font-weight:500;min-height:48px;transition:.15s}.btn:hover{background:#333}.btn:active{transform:scale(.97)}
.btn.g{background:var(--g);color:#000}.btn.g:hover{background:#ffc933}.btn.o{background:#fff;color:#000;border:2px solid #000}.btn.s{padding:8px 14px;min-height:40px;font-size:15px}.btn:disabled{opacity:.4;cursor:not-allowed}
.hero{background:var(--gr);padding:56px 0}.hero .w,.two{display:grid;gap:40px;grid-template-columns:1fr 1fr;align-items:center}@media(max-width:860px){.hero .w,.two{grid-template-columns:1fr}}
.hero h1 span,.g98{color:var(--g)}.hero ul{list-style:none;padding:0;margin:20px 0 28px;color:#555}.hero li:before{content:"✓";display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#2E7D32;color:#fff;font-size:13px;margin-right:10px}
.hero img,.rd{border-radius:20px;width:100%}.sec{padding:64px 0}.sec p{color:var(--m)}
.gal{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.gal img{border-radius:14px;width:100%}
.rv{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.rc{border:1px solid var(--ln);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:28px;font-size:20px}
.av{display:flex;gap:12px;align-items:center;font-size:15px}.av i{width:40px;height:40px;border-radius:50%;background:var(--gr);display:grid;place-items:center;font-style:normal;font-weight:700}.av small{display:block;color:var(--m)}
.grid{display:grid;gap:24px;grid-template-columns:repeat(3,1fr)}@media(max-width:860px){.grid{grid-template-columns:repeat(2,1fr);gap:14px}}
.pc{border:2px solid var(--y);border-radius:12px;overflow:hidden;background:#fff;display:flex;flex-direction:column}.pc img{aspect-ratio:1;object-fit:cover;width:100%;cursor:pointer}
.pc h3{background:var(--y);text-align:center;padding:10px 6px;font:400 clamp(17px,2.4vw,30px)/1.1 'Archivo Black',Inter,sans-serif;text-transform:uppercase;cursor:pointer}
.pc .b{padding:12px;display:flex;flex-direction:column;gap:8px;margin-top:auto}.pr{font-weight:700;font-size:18px}.pr.n{color:var(--m);font-weight:500;font-size:15px}
.bs{display:inline-block;background:#D6D84A;color:#fff;font:400 clamp(26px,4vw,40px) 'Archivo Black',Inter,sans-serif;padding:14px 48px;border-radius:50%/50%;margin-bottom:28px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 24px}.chip{border:2px solid var(--ln);background:#fff;border-radius:24px;padding:8px 16px;min-height:44px}.chip.on{border-color:var(--g);background:#FFF3CC;font-weight:700}
input,textarea,select{font:inherit;width:100%;padding:12px 14px;border:2px solid var(--ln);border-radius:10px;min-height:48px;background:#fff}input:focus,textarea:focus{outline:0;border-color:var(--g)}.er input,.er textarea{border-color:var(--err)}.em{color:var(--err);font-size:14px;margin-top:4px}
.ban{background:linear-gradient(#0003,#0003),var(--gr);text-align:center;padding:72px 20px;color:#fff;position:relative;overflow:hidden}.ban img{position:absolute;inset:0;margin:auto;height:130%;opacity:.35}.ban *{position:relative}.ban h1{font-family:'Archivo Black',Inter,sans-serif}
.mt{border:2px solid #000;border-radius:16px;overflow:hidden;margin-bottom:24px;background:#fff}.mt h3{background:var(--g);padding:12px 18px;font:400 22px 'Archivo Black',Inter,sans-serif}.mr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 18px;border-top:1px solid var(--ln);flex-wrap:wrap}.mr b{color:#d00}
.pd{padding:48px 0 64px}.pd .two{align-items:center}.pimg{background:var(--ac);border-radius:50%/40%;padding:28px 0;position:relative}.pimg img{border-radius:12px;margin:0 auto;width:92%}
.pd h1{color:var(--ac)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}.q{display:inline-flex;align-items:center;border:2px solid var(--ln);border-radius:12px}.q button{width:48px;height:48px;border:0;background:none;font-size:22px}.q button:disabled{opacity:.3}.q span{min-width:36px;text-align:center;font-weight:700}
.lab{font-weight:700;margin-top:18px}.tp{display:flex;gap:8px;flex-wrap:wrap}.tp label{border:2px solid var(--ln);border-radius:10px;padding:8px 12px;cursor:pointer;display:flex;gap:6px;align-items:center;min-height:44px}.tp input{width:auto;min-height:0}
.cl{display:grid;gap:36px;grid-template-columns:1.6fr 1fr;align-items:start;padding:40px 0 64px}@media(max-width:860px){.cl{grid-template-columns:1fr}}
.ci{display:grid;grid-template-columns:84px 1fr auto;gap:14px;border-bottom:1px solid var(--ln);padding:16px 0;align-items:center}.ci img{width:84px;height:84px;object-fit:cover;border-radius:10px}.ci small{color:var(--m);display:block}.add{grid-column:1/-1;background:#FFF8E1;border:1px dashed var(--g);border-radius:12px;padding:12px}
.os{background:#f6f6f6;border-radius:16px;padding:22px;position:sticky;top:96px}.os div{display:flex;justify-content:space-between;gap:12px;padding:5px 0}.os .t{font-weight:700;font-size:20px;border-top:1px solid #ccc;margin-top:8px;padding-top:12px}
.pm{border:2px solid var(--ln);border-radius:14px;padding:18px;margin-bottom:12px;cursor:pointer;display:flex;gap:14px;align-items:flex-start}.pm.on{border-color:var(--g);background:#FFF8E1}.pm i{width:22px;height:22px;border-radius:50%;border:2px solid #999;flex:none;margin-top:3px}.pm.on i{border:7px solid var(--g)}
.demo{border:2px dashed #999;border-radius:10px;padding:12px;margin-top:10px;background:#fff;color:#555;font-size:15px}.ok{width:84px;height:84px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:44px;margin:0 auto 16px}
.st{display:flex;gap:6px;margin:20px 0}.st span{flex:1;text-align:center;font-size:13px;padding:8px 2px;border-radius:8px;background:#eee}.st .a{background:var(--ok);color:#fff}
footer{border-top:1px solid var(--ln);padding:40px 0;margin-top:20px}footer .w{display:grid;gap:30px;grid-template-columns:1.4fr 1fr 1fr 1fr}@media(max-width:760px){footer .w{grid-template-columns:1fr 1fr}footer .w>:first-child{grid-column:1/-1}}
footer a,footer button.l{display:block;color:#444;font-size:15px;padding:6px 0;background:none;border:0;text-align:left;text-decoration:none;cursor:pointer;min-height:36px}footer b{font-size:14px}.ct a{font-size:19px;color:#111}
.cen{text-align:center}.mut{color:var(--m)}.note{background:#FFF3CC;border-radius:10px;padding:10px 14px;font-size:15px}.pad{padding:40px 0}
</style></head><body><div id="app"></div>
